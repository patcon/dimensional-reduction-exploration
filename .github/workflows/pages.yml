name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish, but skip any queued between it and the latest push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Each version is built in parallel and served from its own subpath (/v1-0/, /v1-1/, /v1-2/, /v2-0/, /v3-0/, /v3-1/, /v3-2/, /v3-3/, /v3-4/).
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [v1-0, v1-1, v1-2, v2-0, v3-0, v3-1, v3-2, v3-3, v3-4]
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # <version>/web/public/data/ is gitignored: regenerate it from MNIST with the pipeline.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Cache MNIST download
        uses: actions/cache@v4
        with:
          path: pipeline/data/raw
          key: mnist-raw

      - name: Process data
        working-directory: pipeline
        run: uv run ${{ matrix.version }}.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.version }}/web/pnpm-lock.yaml

      - name: Build app
        working-directory: ${{ matrix.version }}/web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build --base "${{ steps.pages.outputs.base_path }}/${{ matrix.version }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}
          path: ${{ matrix.version }}/web/dist
          retention-days: 1

  # The landing page at the root, with each version's build beneath it.
  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: _site

      - name: Add landing page
        run: cp -r site/. _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
