name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish, but skip any queued between it and the latest push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # web/public/data/ is gitignored: regenerate it from MNIST with the pipeline.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: v1/pipeline/uv.lock

      - name: Cache MNIST download
        uses: actions/cache@v4
        with:
          path: v1/pipeline/data/raw
          key: mnist-raw-v1

      - name: Process data
        working-directory: v1/pipeline
        run: uv run process.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: v1/web/pnpm-lock.yaml

      - name: Build site
        working-directory: v1/web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build --base "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: v1/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
